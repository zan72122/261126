<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#140f1c">
<title>おまつりの わたあめやさん</title>
<link rel="modulepreload" href="three.module.min.js">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#140f1c;overflow:hidden;overscroll-behavior:none;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;touch-action:none}
/* filmic vignette over the 3D view */
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,0) 55%,rgba(10,6,14,.38) 100%)}
/* warm lantern glow shown while the 3D scene starts */
#veil{position:fixed;inset:0;pointer-events:none;transition:opacity 1s ease;
  background:radial-gradient(circle at 50% 42%,#ffb35c 0,#c2502c 18%,#3b1a22 46%,#140f1c 75%)}
#veil i{position:absolute;left:50%;top:42%;width:64px;height:86px;margin:-43px 0 0 -32px;border-radius:46%;
  background:radial-gradient(circle at 50% 45%,#fff2cf 0,#ffb45a 45%,#c8322a 80%);box-shadow:0 0 60px 20px rgba(255,150,70,.55);
  animation:sway 1.6s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
#hand{position:fixed;left:0;top:0;width:52px;height:60px;pointer-events:none;opacity:0;transition:opacity .3s;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.45));transform-origin:18px 6px;z-index:5}
</style>
<script src="../../gf-playlog.js"></script>

<script src="/gf-nav.js" defer></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>
<svg id="hand" viewBox="0 0 52 60" aria-hidden="true"><path d="M18 4c3 0 5 2 5 5v17l2-1c2-1 4 0 5 2l1 1c2-1 4 0 5 2 2-1 5 0 5 3v12c0 9-6 14-14 14h-3c-6 0-10-3-13-8L4 37c-1-3 1-5 3-5 2 0 3 1 4 3l2 3V9c0-3 2-5 5-5z" fill="#fff" stroke="#c9c2bb" stroke-width="1.5"/></svg>
<div id="veil"><i></i></div>
<script type="module" src="main.js"></script>
</body>
</html>
