<title>けーきやさんの しあげ</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#2a1c14;overflow:hidden;overscroll-behavior:none;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;outline:none}
#ld{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#5a3d29 0%,#2a1c14 70%);transition:opacity .8s;z-index:5;pointer-events:none}
#ld .c{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fffaf2 0%,#efe4d2 55%,#c9b597 100%);box-shadow:0 10px 30px rgba(0,0,0,.45);animation:bob 1.1s ease-in-out infinite}
#ld .c:after{content:"";display:block;width:22px;height:22px;margin:-4px auto 0;border-radius:50% 50% 45% 45%;background:radial-gradient(circle at 40% 35%,#ff9a8a,#b3141c 60%,#6d0b10);position:relative;top:-6px}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-10px) scale(1.04)}}
#ld.h{opacity:0}
</style>

<script src="../../gf-playlog.js" defer></script>

<script src="/gf-nav.js" defer></script>
</head>

<div id="ld"><div class="c"></div></div>
