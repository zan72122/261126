<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#120b06">
<meta name="robots" content="noindex">
<title>かぼちゃのランタン</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#120b06;overflow:hidden;overscroll-behavior:none;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#c{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none}
#veil{position:fixed;inset:0;background:radial-gradient(circle at 50% 55%,#3a1d08 0%,#120b06 70%);display:flex;align-items:center;justify-content:center;transition:opacity .9s;z-index:5}
#veil.off{opacity:0;pointer-events:none}
#veil .p{width:92px;height:78px;border-radius:50% 50% 46% 46%/56% 56% 44% 44%;
  background:radial-gradient(circle at 38% 34%,#ffb45a 0%,#e8741c 38%,#a8440c 75%,#6a2506 100%);
  box-shadow:0 0 40px rgba(255,150,40,.45);position:relative;animation:bob 1.6s ease-in-out infinite}
#veil .p:before{content:"";position:absolute;left:41px;top:-14px;width:10px;height:18px;border-radius:4px;background:#5b4a22}
#veil .p i{position:absolute;bottom:18px;left:24px;width:44px;height:14px;border-radius:0 0 30px 30px;background:#ffd76a;box-shadow:0 0 14px #ffc14a}
#veil .p b{position:absolute;top:22px;width:13px;height:13px;border-radius:50%;background:#ffd76a;box-shadow:0 0 10px #ffc14a}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
#hand{position:fixed;left:0;top:0;width:84px;height:84px;margin:-6px 0 0 -26px;pointer-events:none;opacity:0;transition:opacity .4s;z-index:3;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.45))}
#hand.on{opacity:1;animation:poke 1.1s ease-in-out infinite}
@keyframes poke{0%,100%{transform:translate(10px,16px) scale(1)}45%{transform:translate(0,0) scale(1)}55%{transform:translate(0,0) scale(.9)}}
#ring{position:fixed;left:0;top:0;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:3px solid rgba(255,255,255,.85);
  pointer-events:none;opacity:0;z-index:3}
#ring.on{animation:ring 1.1s ease-out infinite}
@keyframes ring{0%,40%{transform:scale(.3);opacity:0}50%{opacity:.9}100%{transform:scale(1.2);opacity:0}}
</style>
<script src="../../gf-playlog.js"></script>
<script type="importmap">{"imports":{"three":"./lib/three.module.min.js"}}</script>

<script src="/gf-nav.js" defer></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ring"></div>
<svg id="hand" viewBox="0 0 64 64"><path fill="#fff" stroke="#c9c2b8" stroke-width="1.5" stroke-linejoin="round"
 d="M24 6c3 0 5 2 5 5v17l2-1c2-1 5 0 6 2l1 1c2-1 5 0 6 2l1 1c2-1 5 0 6 2 1 2 1 3 1 6v9c0 7-6 13-13 13h-6c-5 0-8-2-11-6L12 42c-2-2-2-5 0-6 2-2 5-1 7 1l1 2V11c0-3 2-5 4-5z"/></svg>
<div id="veil"><div class="p"><b style="left:20px"></b><b style="right:20px"></b><i></i></div></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
