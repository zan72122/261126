<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#dfeefc">
<title>雪の滑り台</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: linear-gradient(#8cc4ff, #eaf4ff 60%, #ffffff); overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; opacity: 0; transition: opacity .3s ease; }
  body.ready #c { opacity: 1; }
  /* loading: a slowly turning snowflake, no text */
  #load { position: fixed; left: 50%; top: 50%; width: 72px; height: 72px; margin: -36px 0 0 -36px; transition: opacity .4s; animation: spin 3s linear infinite; }
  body.ready #load { opacity: 0; pointer-events: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* round "again" button (no text) */
  #again { position: fixed; right: max(24px, env(safe-area-inset-right)); bottom: max(24px, env(safe-area-inset-bottom)); width: 112px; height: 112px; padding: 0; border: 0; border-radius: 50%;
           background: transparent; box-shadow: 0 6px 18px rgba(40,90,160,.35), 0 0 0 6px rgba(255,255,255,.6); touch-action: none; transition: transform .35s cubic-bezier(.3,1.6,.5,1), opacity .35s; }
  #again.hidden { transform: scale(0); opacity: 0; pointer-events: none; }
  #again.show { transform: scale(1); opacity: 1; animation: glow 1.8s ease-in-out infinite; }
  #again.nudge { animation: nudge .6s ease, glow 1.8s ease-in-out infinite .6s; }
  @keyframes glow { 50% { box-shadow: 0 6px 18px rgba(40,90,160,.35), 0 0 0 14px rgba(255,236,140,.75); } }
  @keyframes nudge { 30% { transform: scale(1.18) rotate(-12deg); } 60% { transform: scale(.95) rotate(8deg); } }
  /* soft snow curtain between rounds */
  #curtain { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .75s ease;
             background: radial-gradient(circle at 30% 30%, #fff 0 2px, transparent 3px) 0 0/48px 48px, radial-gradient(circle at 70% 60%, #fff 0 3px, transparent 4px) 0 0/64px 64px, linear-gradient(#f4f9ff, #ffffff); }
  #curtain.on { opacity: 1; }
  #debug { position: fixed; left: 6px; top: 6px; margin: 0; padding: 6px 8px; font: 11px/1.35 ui-monospace, Menlo, monospace; color: #fff; background: rgba(0,0,0,.55); border-radius: 6px; pointer-events: none; z-index: 9; white-space: pre; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<svg id="load" viewBox="-50 -50 100 100" aria-hidden="true"><g stroke="#ffffff" stroke-width="7" stroke-linecap="round" fill="none">
  <path d="M0-42V42M-36-21L36 21M-36 21L36-21"/><path d="M-10-32L0-22L10-32M-10 32L0 22L10 32"/></g></svg>

</html>
