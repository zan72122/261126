<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2a2140">
<title>わたあめ屋さん</title>
<style>
  /* 全画面：高さは 100dvh（アドレスバーの出入りに合わせる）。対応していない時は 100vh。黒い帯や余白は作らない */
  html, body { margin: 0; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; background: #2a2140; }
  body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; overscroll-behavior: none;
         background: radial-gradient(ellipse at 50% 70%, #ffd7e6 0%, #f6a8c4 35%, #3a2d4a 100%); }
  #c { position: absolute; inset: 0; display: block; width: 100%; height: 100%; opacity: 0; transition: opacity .5s ease; touch-action: none; outline: none; }
  /* 起動中：文字なし。ふわふわの丸がゆっくり息をする */
  #wait { position: fixed; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
          background: radial-gradient(circle at 40% 35%, #fff 0%, #ffd0e3 45%, #ff9cc4 100%); box-shadow: 0 0 40px #fff6; animation: breathe 1.4s ease-in-out infinite; }
  body.ready #wait { display: none; }
  @keyframes breathe { 50% { transform: scale(1.12); } }
  /* 全画面ボタン（大人向け、右上の隅）：safe-area の内側。全画面になったら隠れる */
  #fs { position: fixed; z-index: 5; top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right));
        width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; background: rgba(42, 33, 64, .35); color: #fff; opacity: .75;
        display: none; align-items: center; justify-content: center; touch-action: manipulation; cursor: pointer; }
  body.ready #fs:not([hidden]) { display: flex; }
  #fs svg { width: 22px; height: 22px; }
</style>
</head>
<body>
<div id="wait"></div>
<canvas id="c"></canvas>
<button id="fs" type="button" aria-label="全画面" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
<!-- file:// でも動くように classic script（npm run build で生成） -->
<script src="hero/hero.build.js"></script>
<script src="dist/shell.js"></script>
</body>
</html>
