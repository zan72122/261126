<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3e6d2">
<title>かき氷屋さん</title>
<style>
  /* 全画面：100dvh（アドレスバーの出入りに追従）。古いブラウザは 100vh を使う */
  html, body { margin: 0; padding: 0; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; background: #f3e6d2; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #c { display: block; position: fixed; left: 0; top: 0; width: 100vw; width: 100dvw; height: 100vh; height: 100dvh; touch-action: none; opacity: 0; transition: opacity .5s ease; }
  /* safe-area の大きさを JS へ渡すための見えない箱（画面の端の道具・ボタンはこの内側に置く） */
  #safe { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  body.ready #c { opacity: 1; }
  /* 待つ間：文字なしの、ふわふわ揺れる氷の玉 */
  #wait { position: fixed; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff, #cfeaff 60%, #9fd8ff); box-shadow: 0 6px 18px rgba(80,120,160,.25);
    animation: bob 1s ease-in-out infinite alternate; transition: opacity .4s; }
  body.ready #wait { opacity: 0; pointer-events: none; }
  @keyframes bob { from { transform: translateY(-6px) scale(1); } to { transform: translateY(6px) scale(1.06); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="wait"></div>
<div id="safe"></div>
<script>
// file:// ではモジュールと画像が制限されるので、生成済みのクラシック版と base64 テクスチャを使う。
// http(s)（GitHub Pages など）では ES モジュールをそのまま使う。
(function () {
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  document.addEventListener('dblclick', function (e) { e.preventDefault(); });
  function load(src, cb) {
    var s = document.createElement('script'); s.src = src; s.onload = cb;
    s.onerror = function () { console.error('load failed: ' + src); }; document.head.appendChild(s);
  }
  if (location.protocol === 'file:') {
    load('assets/tex-data.js', function () { load('build/shell.js', function () { load('hero/hero.build.js', function () {
      window.KakigoriShell.start(window.KakigoriHero.createHero);
    }); }); });
  } else {
    var m = document.createElement('script'); m.type = 'module';
    m.textContent = "import { start } from './shell/main.js'; import { createHero } from './hero/hero.js'; start(createHero);";
    document.head.appendChild(m);
  }
})();
</script>
</body>
</html>
