<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#cfe9fb">
<title>ショベルカーで砂あそび</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#cfe9fb;overscroll-behavior:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #app{position:fixed;inset:0;touch-action:none}
  #view{display:block;touch-action:none}
  /* 読み込み中：砂色の地面と、はねる黄色い丸（文字なし） */
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(#cfe9fb 0 45%,#e8d2a3 45% 100%);transition:opacity .4s;z-index:20;pointer-events:none}
  #boot i{width:64px;height:64px;border-radius:50%;background:#ffd21f;box-shadow:0 6px 0 #d9a800;animation:b .6s ease-in-out infinite alternate}
  @keyframes b{from{transform:translateY(0)}to{transform:translateY(-28px)}}
  body.ready #boot{opacity:0}
  body.nogl #boot i{animation:none;background:#bbb;box-shadow:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="boot"><i></i></div>
<!-- file:// でも動くよう、ES モジュールではなく古典的スクリプト（npm run build で生成） -->
<script src="assets/textures.js"></script>
<script src="hero/hero.bundle.js"></script>
<script src="build/app.js"></script>
</body>
</html>
