<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3ead9">
<title>スーパーのレジ</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f3ead9; }
  body { position: fixed; inset: 0; height: 100vh; height: 100dvh; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  /* 全画面：100dvh（アドレスバーの出入りに追従）。使えない古いブラウザは 100vh。黒い帯・余白は作らない */
  #game { position: fixed; left: 0; top: 0; display: block; width: 100vw; width: 100dvw; height: 100vh; height: 100dvh; touch-action: none; outline: none; background: #f3ead9; }
  #cover { position: fixed; inset: 0; background: #f3ead9; display: flex; align-items: center; justify-content: center; transition: opacity .35s; pointer-events: none; }
  #cover i { width: 64px; height: 64px; border-radius: 50%; background: #ff8fab; animation: b 0.9s ease-in-out infinite; }
  @keyframes b { 0%,100% { transform: scale(.7); } 50% { transform: scale(1); } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="cover"><i></i></div>
<script>
  // 既定：dist/game.js（1本の普通のスクリプト。file:// でも動く）。
  // 開発：http で ?src=1 を付けると ES モジュールのまま読む（ビルド不要）。
  (function () {
    var useSrc = /[?&]src=1/.test(location.search) && location.protocol !== 'file:';
    var s = document.createElement('script');
    if (useSrc) { s.type = 'module'; s.src = 'shell/main.js'; }
    else { s.src = 'dist/game.js'; }
    s.onerror = function () { document.body.style.background = '#f8c'; };
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
