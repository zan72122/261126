<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#9fd3f5">
<title>くるまのフェリー</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #a9d8f6;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  html, body { height: 100vh; height: 100dvh; } /* the visible height on phones/tablets (100vh as the fallback) */
  #game { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; width: 100dvw; height: 100dvh;
    display: block; touch-action: none; outline: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
  // http(s): ES modules (always the current app/hero/hero.js).
  // file:// : modules and images cannot be loaded there, so use the prebuilt classic scripts (npm run build).
  (function () {
    function add(src, module) {
      var s = document.createElement('script');
      if (module) s.type = 'module'; else s.async = false;
      s.src = src; document.head.appendChild(s);
    }
    if (location.protocol === 'file:') {
      add('hero/hero.classic.js'); add('assets/textures.classic.js'); add('shell/shell.classic.js');
    } else {
      add('shell/main.js', true);
    }
  })();
</script>
</body>
</html>
