<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#cfe0ee">
<title>ぬのを そめよう</title>
<style>
  html, body { margin: 0; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; background: #cfe0ee; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 16px; background: linear-gradient(#cfe0ee, #e9e4d8); transition: opacity .6s; z-index: 5; pointer-events: none; }
  #boot.off { opacity: 0; }
  .drop { width: 30px; height: 30px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); animation: hop 1s ease-in-out infinite; }
  .drop:nth-child(1) { background: #2e4f86; } .drop:nth-child(2) { background: #c9668d; animation-delay: .15s; } .drop:nth-child(3) { background: #3d6aa8; animation-delay: .3s; }
  @keyframes hop { 0%,100% { transform: rotate(-45deg) translate(0,0); } 50% { transform: rotate(-45deg) translate(14px,-14px); } }
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .btn { position: absolute; width: 58px; height: 58px; border-radius: 50%; background: rgba(255,255,255,.62); box-shadow: 0 2px 8px rgba(40,60,90,.25); pointer-events: auto; display: none; border: 0; padding: 0; touch-action: manipulation; }
  .btn.on { display: block; }
  .btn svg { width: 32px; height: 32px; margin: 13px; display: block; }
  #again { right: calc(env(safe-area-inset-right, 0px) + 14px); top: calc(env(safe-area-inset-top, 0px) + 14px); }
  #fs { left: calc(env(safe-area-inset-left, 0px) + 14px); top: calc(env(safe-area-inset-top, 0px) + 14px); width: 46px; height: 46px; }
  #fs svg { width: 24px; height: 24px; margin: 11px; }
  #hand { position: absolute; width: 74px; height: 74px; left: 0; top: 0; opacity: 0; transition: opacity .4s; pointer-events: none; filter: drop-shadow(0 3px 4px rgba(0,0,0,.35)); }
  #hand.on { opacity: 1; }
</style>

<script src="../../gf-playlog.js" defer></script>

<script src="/gf-nav.js" defer></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <button class="btn" id="again" aria-label="もういちど"><svg viewBox="0 0 24 24" fill="none" stroke="#3d5f93" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg></button>
  <button class="btn" id="fs" aria-label="ぜんがめん"><svg viewBox="0 0 24 24" fill="none" stroke="#3d5f93" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6"/></svg></button>
  <svg id="hand" viewBox="0 0 64 64"><path d="M26 6c3 0 5 2 5 5v17l2-1c2-1 5 0 6 2l1 1c2-1 5 0 6 2 2-1 5 0 6 3v13c0 8-6 13-14 13h-4c-6 0-10-3-13-8l-8-12c-1-2 0-5 3-6 2-1 4 0 5 1l1 2V11c0-3 2-5 4-5z" fill="#fff" stroke="#5a6b80" stroke-width="2.2" stroke-linejoin="round"/></svg>
</div>
<div id="boot"><div class="drop"></div><div class="drop"></div><div class="drop"></div></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
