<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fbe9e4">
<title>にじいろキャンディ工場</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fbe9e4; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; }
  /* 起動中・コンテキスト喪失中：文字なしの、はずむ飴玉 */
  #boot, #veil { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; gap: 18px; background: #fbe9e4; transition: opacity .35s; z-index: 5; pointer-events: none; }
  #boot.off { opacity: 0; }
  #veil { opacity: 0; background: rgba(251,233,228,.6); }
  #veil.on { opacity: 1; }
  .dot { width: 34px; height: 34px; border-radius: 50%; animation: hop .9s ease-in-out infinite; box-shadow: inset -5px -6px 0 rgba(0,0,0,.08); }
  .dot:nth-child(1) { background: #ff8fb8; } .dot:nth-child(2) { background: #8fd6ff; animation-delay: .15s; } .dot:nth-child(3) { background: #ffe066; animation-delay: .3s; }
  @keyframes hop { 0%,100% { transform: translateY(0) scale(1.08,.92); } 50% { transform: translateY(-26px) scale(.95,1.05); } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="boot"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
<div id="veil"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
<!-- three・shell・hero・テクスチャを束ねた classic script（file:// と GitHub Pages の両方で動く。npm run build で作る） -->
<script src="game.js"></script>
</body>
</html>
