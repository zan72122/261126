<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1a1512">
<title>さびたロボット ぴかぴか</title>
<style>
  html, body { margin: 0; width: 100%; height: 100vh; height: 100dvh; overflow: hidden; background: #1a1512; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
  #c { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; opacity: 0; transition: opacity .6s ease; }
  body.ready #c { opacity: 1; }
  /* loading: a slowly turning gear, no text */
  #load { position: fixed; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; transition: opacity .4s; animation: spin 2.4s linear infinite; }
  body.ready #load { opacity: 0; pointer-events: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* hint: a white pointing hand */
  #hint { position: fixed; left: 0; top: 0; width: 64px; height: 64px; pointer-events: none; opacity: 0; transition: opacity .5s; filter: drop-shadow(0 3px 5px rgba(0,0,0,.45)); z-index: 3; }
</style>
</head>
<body>
<svg id="load" viewBox="0 0 100 100" aria-hidden="true"><g fill="#c9b8a4"><path d="M50 14l7 0 2 10 8 3 8-6 5 5-6 8 3 8 10 2 0 7-10 2-3 8 6 8-5 5-8-6-8 3-2 10-7 0-2-10-8-3-8 6-5-5 6-8-3-8-10-2 0-7 10-2 3-8-6-8 5-5 8 6 8-3z" transform="translate(-3.5 0)"/><circle cx="46.5" cy="50" r="12" fill="#1a1512"/></g></svg>
<canvas id="c"></canvas>

<script src="game.js" type="module"></script>
<script src="../../gf-playlog.js" defer></script>
</body>
</html>
