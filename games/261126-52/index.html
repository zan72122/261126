<title>ゆきのひこうき</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b1424;overscroll-behavior:none;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none}
#hand{position:fixed;left:0;top:0;width:56px;height:64px;pointer-events:none;opacity:0;transition:opacity .4s;z-index:3;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.45))}
#splash{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 85%,#3b4a6e 0%,#16223a 45%,#0b1424 100%);transition:opacity .9s}
#splash.off{opacity:0;pointer-events:none}
#splash svg{width:120px;height:120px;animation:bob 2.2s ease-in-out infinite;opacity:.9}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(3deg)}}
</style>
