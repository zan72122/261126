var RIN=4800,CD=13000,KD=90,C2=3000,K2=70;
function stepWater(dt){
  var n=Math.max(1,Math.ceil(dt/(1/120))),h=dt/n,s,i;
  for(i=0;i<4;i++)ED[EDGE_ORDER[i]].q=0;POOLS.forEach(function(p){p.qin=0;p.over=0;});
  for(s=0;s<n;s++){
    POOLS.forEach(function(p){p.dV=0;});
    var fill=function(p){var q=RIN*clamp((p.ry-10-p.depth)/6,0,1);p.dV+=q;p.qin=Math.max(p.qin,q);};
    if(eggs.D.opened)fill(PO.D);if(eggs.T.opened)fill(PO.T);
    for(i=0;i<4;i++){var e=ED[EDGE_ORDER[i]];if(!e.open)continue;var A=PO[e.a],B=PO[e.b];
      if(!B||!B.active){var hA=e.sill-surfY(A);if(hA<=0)continue;var q=CD*Math.min(1,hA/3)+KD*hA;q=Math.min(q,A.V/h);A.dV-=q;if(B)B.dV+=q;e.q=Math.max(e.q,q);}
      else{var ha=Math.max(0,e.sill-surfY(A)),hb=Math.max(0,e.sill-surfY(B)),dh=ha-hb;if(Math.abs(dh)<0.02)continue;
        var wA=Math.max(8,surfW(A,A.depth)),wB=Math.max(8,surfW(B,B.depth)),lim=Math.abs(dh)*wA*wB/(wA+wB)*.5/h;
        var q2=(C2*Math.min(1,Math.abs(dh)/3)+K2*Math.abs(dh));q2=Math.min(q2,lim);
        if(dh>0){q2=Math.min(q2,A.V/h);A.dV-=q2;B.dV+=q2;e.q=q2;}else{q2=Math.min(q2,B.V/h);B.dV-=q2;A.dV+=q2;e.q=-q2;}}}
    POOLS.forEach(function(p){if(!p.active)return;if(p.depth>p.ry-2){var q=CD*.5+KD*(p.depth-(p.ry-2));p.dV-=q;p.over=q;}});
    POOLS.forEach(function(p){if(!p.active){p.V=0;p.depth=0;return;}p.V=clamp(p.V+p.dV*h,0,p.cap);p.depth=depthOf(p,p.V);});
  }
}

/* ---------- eggs update ---------- */
function eggCrack(egg){return CR['hatch'+egg.key];}
function updateEgg(egg,dt){
  var c=eggCrack(egg);
  egg.intro=Math.min(1,egg.intro+dt/0.9);
  egg.pieces.forEach(function(pc){
    if(!pc.det){var aj=pc.ajar*0.07*(pc.cen[0]<0?-1:1);pc.angV+=(-(pc.ang-aj)*70-pc.angV*7)*dt;pc.ang+=pc.angV*dt;pc.press=Math.max(0,pc.press-dt*5);}
    else if(!pc.arr){pc.t+=dt/0.75;if(pc.t>=1){pc.t=1;pc.arr=true;pc.arrT=T;egg.arrN++;SFX.tick(.3+egg.arrN*.08,784);}}});
  if(c.bins&&!egg.opened){
    egg.pieces.forEach(function(pc){if(pc.det)return;var tot=0,cov=0;for(var i=0;i<c.N;i++){var x=crackPt(c,(i+.5)/c.N*c.len)[0]-egg.ax;if(x>=pc.x0-6&&x<=pc.x1+6){tot++;if(c.bins[i])cov++;}}
      pc.ajar=tot?cov/tot:0;if(pc.row>0)pc.ajar*=.5;});
  }
  if(egg.opened){egg.openA=Math.min(1,egg.openA+dt/0.6);egg.frontA=Math.max(0,egg.frontA-dt/0.6);}
  if(egg.opened&&!egg.hatched&&egg.arrN>=egg.pieces.length){egg.hatched=true;onHatched(egg);}
}
function detachNext(egg){
  var best=null,bv=-1e9;egg.pieces.forEach(function(pc){if(pc.det)return;var v=pc.ajar*2-pc.row;if(v>bv){bv=v;best=pc;}});
  if(!best)return;best.det=true;best.t=0;best.part=egg.detN++;
  var w=[egg.ax+best.cen[0],egg.ay+best.cen[1]];chips(w[0],w[1],5,'ivo',160);SFX.pop(best.part);
  if(egg.detN===1)startForming(egg);
}
function updateDetach(egg){
  var c=eggCrack(egg),n=egg.pieces.length,want=Math.floor(n*Math.min(1,c.cov/0.85));
  if(c.cov>=0.85)want=n;
  var guard=0;while(egg.detN<want&&guard++<20)detachNext(egg);
  if(egg.detN>=n&&!egg.opened){egg.opened=true;onOpened(egg);}
}
function startForming(egg){var ch=egg.key==='D'?dino:egg.key==='T'?turtle:chick;ch.st='form';}
function onOpened(egg){
  logEv('open'+egg.key);
  if(egg.key==='D'){chips(egg.ax,egg.ay-40,8,'ivo',200);drops(egg.ax,egg.ay,8,200);}
  if(egg.key==='T'){drops(egg.ax,egg.ay,6,180);}
}
function onHatched(egg){
  if(egg.key==='D'){dino.st='walk';dino.bt=0;dino.from=[dino.x,dino.y];disc('d1hatch',dino.x,dino.y-80);}
  else if(egg.key==='T'){turtle.st='drop';turtle.bt=0;turtle.from=[turtle.x,turtle.y];disc('d1link',egg.ax,egg.ay-40);}
  else{chick.st='rise';chick.bt=0;chick.from=[chick.x,chick.y];disc('chickHatch',egg.ax,egg.ay-40);}
}
function babyRootForming(egg){if(egg.key==='D')return [egg.ax,egg.ay];if(egg.key==='T')return [egg.ax,egg.ay-6];return [egg.ax,egg.ay-6];}

/* ---------- dino ---------- */
function dinoHome(){return [PO.D.cx+L.homeDx,PO.D.rim];}
function boatPose(){
  var b=boat,draft=b.loaded?15:7,x,y,ang=b.rock;
  if(b.st==='transit'){var tr=b.tr,t=easeIO(clamp(tr.t,0,1)),pt=pathAt(tr.path,t,tr.bez);x=pt[0];y=pt[1];ang+=Math.sin(tr.t*PI*3)*.08;}
  else if(b.st==='lift'){var lf=b.lift,tt=easeIO(clamp(lf.t,0,1)),p2=pathAt(lf.path,tt,true);x=p2[0];y=p2[1];ang+=Math.sin(T*6)*.12;}
  else{var p=PO[b.pool];x=p.cx+b.u;if(b.st==='float'){y=surfY(p)+waveY(p,x);ang+=Math.atan2(waveY(p,x+10)-waveY(p,x-10),20)*.6;}
    else{y=floorAt(p,b.u)-draft;var r=b.u/p.rx;ang+=r*.5;}}
  var deckY=y-(20-draft);
  return {x:x,y:y,ang:ang,draft:draft,deck:[x+Math.sin(ang)*(20-draft),deckY]};
}
function pathAt(path,t,bez){
  if(bez&&path.length===3){var a=path[0],b=path[1],c=path[2],u=1-t;return [u*u*a[0]+2*u*t*b[0]+t*t*c[0],u*u*a[1]+2*u*t*b[1]+t*t*c[1]];}
  var segs=path.length-1,ft=t*segs,i=Math.min(segs-1,Math.floor(ft)),lt=ft-i;return [lerp(path[i][0],path[i+1][0],lt),lerp(path[i][1],path[i+1][1],lt)];}
function updateDino(dt){
  var d=dino;d.stompT=Math.max(0,d.stompT-dt);d.happy=Math.max(0,d.happy-dt);d.surp=Math.max(0,d.surp-dt);d.cool=Math.max(0,d.cool-dt);d.wig=Math.max(0,d.wig-dt*3);
  d.blink-=dt;if(d.blink<-0.14)d.blink=2.5+rnd()*3;
  var hm=dinoHome();d.tilt=0;
  switch(d.st){
   case 'egg':d.x=eggs.D.ax;d.y=eggs.D.ay;d.s=1;d.dir=1;break;
   case 'form':var r=babyRootForming(eggs.D);d.x=r[0];d.y=r[1];d.s=1;d.dir=1;break;
   case 'walk':d.bt+=dt/1.4;var t=Math.min(1,d.bt);d.dir=-1;d.x=lerp(d.from[0],hm[0],easeIO(t));d.y=lerp(d.from[1],hm[1],t)-Math.abs(Math.sin(t*PI*3))*10;
     if(t>=1){d.st='home';d.dir=1;}break;
   case 'home':d.x=hm[0];d.y=hm[1];d.s=1;d.dir=1;
     if(!boat.loaded&&boat.pool==='D'&&boat.st==='float'&&boat.u<-PO.D.rx*0.3&&boat.armed&&d.cool<=0&&!ending){d.st='board';d.bt=0;d.from=[d.x,d.y];}
     break;
   case 'board':d.bt+=dt/0.7;var t2=Math.min(1,d.bt),bp=boatPose();d.x=lerp(d.from[0],bp.deck[0],t2);d.y=lerp(d.from[1],bp.deck[1],t2)-Math.sin(t2*PI)*60;d.s=lerp(1,.7,t2);
     if(t2>=1){d.st='aboard';boat.loaded=true;boat.armed=false;boat.rockV+=2.5;drops(bp.x,bp.y,8,180);SFX.splash(10);SFX.voice(10);disc('d6board',bp.x,bp.y-60);}
     break;
   case 'aboard':var bp2=boatPose();d.x=bp2.deck[0];d.y=bp2.deck[1];d.s=.7;d.tilt=bp2.ang;
     if(boat.st==='beach'&&(boat.pool==='D'||boat.pool==='T')&&!ending){d.st='off';d.bt=0;d.from=[d.x,d.y];boat.loaded=false;d.cool=1.5;
       if(boat.pool==='D')disc('d6off',d.x,d.y-50);else logEv('offT');}
     break;
   case 'off':d.bt+=dt/(boat.pool==='D'?0.8:1.4);var t3=Math.min(1,d.bt);d.x=lerp(d.from[0],hm[0],easeIO(t3));d.y=lerp(d.from[1],hm[1],t3)-Math.sin(t3*PI)*55;d.s=lerp(.7,1,t3);d.dir=t3<1?-1:1;
     if(t3>=1){d.st='home';d.dir=1;boat.armed=false;}break;
   case 'bowWalk':case 'bow':endingChar(d,dt,[PO.D.cx-60,L.bowY],1);break;
  }
}
function endingChar(ch,dt,dst,sc){
  if(ch.st==='bowWalk'){ch.bt+=dt/1.4;var t=Math.min(1,ch.bt);ch.x=lerp(ch.from[0],dst[0],easeIO(t));ch.y=lerp(ch.from[1],dst[1],t)-Math.sin(t*PI)*40;ch.s=lerp(ch.s,sc,t);if(t>=1)ch.st='bow';}
  else{ch.x=dst[0];ch.y=dst[1];ch.s=sc;var e=ending?ending.t:0;if(e>3.1&&e<5.6){var ph=(e-3.1)/1.2;ch.tilt=ch.dir*Math.max(0,Math.sin(ph*PI))*.45;ch.happy=.3;}else ch.tilt=0;}
}
function doStomp(){
  var d=dino;if(!(d.st==='home'||d.st==='aboard'))return;
  d.combo=(T-d.lastStomp<1.4)?Math.min(6,d.combo+1):0;d.prevStomp=d.lastStomp;d.lastStomp=T;d.stompT=.55;stompN++;
  var src=d.st==='aboard'?boat.pool:'D',p=PO[src];
  SFX.voice(p.depth);SFX.stomp(p.depth,d.combo);
  if(boat.st==='transit'||boat.st==='lift'){chips(d.x,d.y,4,'sand',80);return;}
  if(!p.active||p.depth<6){chips(d.x,d.y,6,'sand',90);logEv('stompDry');return;}
  var amp=9+d.combo*1.6,reached={},q=[[src,0.12,amp]];reached[src]=1;
  while(q.length){var it=q.shift();waves.push({pool:it[0],at:T+it[1],amp:it[2],src:src});
    EDGE_ORDER.forEach(function(k){var e=ED[k];if(!e.open)return;var other=null;
      if(e.a===it[0]&&PO[e.b])other=e.b;else if(e.b===it[0]&&PO[e.a]&&k!=='Tlo')other=e.a;
      if(!other||reached[other]||!PO[other].active)return;var pp=PO[it[0]];
      if(k==='Tlo'){if(it[0]!=='T'||(pp.depth<2&&e.q<300))return;}else if(e.sill-surfY(pp)<1&&e.sill-surfY(PO[other])<1)return;
      reached[other]=1;q.push([other,it[1]+0.5,it[2]*0.7]);});}
  var rk=Object.keys(reached);logEv('stomp:'+src+':'+rk.join(''));
  if(src==='D'&&rk.length===1&&!ED.DT.open)disc('d5solo',p.cx,surfY(p)-20);
}
function updateWaves(dt){
  for(var i=waves.length-1;i>=0;i--){var w=waves[i];if(T<w.at)continue;waves.splice(i,1);var p=PO[w.pool];if(!p.active||p.depth<3)continue;
    p.amp=Math.max(p.amp,w.amp);var n=Math.round(3+w.amp*.4);for(var k=0;k<n;k++){var x=p.cx+(rnd()-.5)*surfW(p,p.depth)*.8;drops(x,surfY(p),1,120+w.amp*8);}
    if(w.pool!==w.src)SFX.splash(w.amp);
    if(boat.pool===w.pool&&boat.st==='float'){var big=boat.loaded?2.4:1;boat.rockV+=(rnd()<.5?-1:1)*w.amp*.075*big;
      var bp=boatPose();drops(bp.x,bp.y,Math.round(4*big),150*big);
      if(w.pool!==w.src){if(w.pool==='P')disc('d5far',bp.x,bp.y-40);else disc('d5near',bp.x,bp.y-40);}
      if(boat.loaded&&w.pool===w.src)logEv('bigRock');}}
  POOLS.forEach(function(p){p.amp*=Math.exp(-1.25*dt);});
}

/* ---------- turtle ---------- */
function updateTurtle(dt){
  var t=turtle;t.happy=Math.max(0,t.happy-dt);t.surp=Math.max(0,t.surp-dt);t.wig=Math.max(0,t.wig-dt*3);t.blink-=dt;if(t.blink<-.14)t.blink=2+rnd()*3;t.tilt=0;
  switch(t.st){
   case 'egg':t.x=eggs.T.ax;t.y=eggs.T.ay;t.s=1;t.dir=1;return;
   case 'form':var r=babyRootForming(eggs.T);t.x=r[0];t.y=r[1];t.dir=1;return;
   case 'drop':t.bt+=dt/0.8;var k=Math.min(1,t.bt),p=PO.T,ex=p.cx-10,ey=Math.min(floorAt(p,-10),surfY(p)+8);
     t.x=lerp(t.from[0],ex,k);t.y=lerp(t.from[1],ey,k)-Math.sin(k*PI)*50;t.dir=-1;
     if(k>=1){t.pool='T';t.u=-10;t.st=localDepth(p,-10)>=22?'swim':'walk';drops(t.x,t.y,6,150);SFX.bloop();}return;
   case 'hop':t.bt+=dt/0.8;var k2=Math.min(1,t.bt),a=t.hop.from,b=t.hop.to;t.x=lerp(a[0],b[0],k2);t.y=lerp(a[1],b[1],k2)-Math.sin(k2*PI)*30;
     if(k2>=1){t.pool=t.hop.pool;t.u=b[0]-PO[t.pool].cx;t.st='swim';SFX.bloop();drops(t.x,t.y,4,120);}return;
   case 'bowWalk':case 'bow':endingChar(t,dt,[PO.T.cx+30,L.bowY],1);return;
  }
  var p2=PO[t.pool],ld=localDepth(p2,t.u),swim=ld>=22;
  if(swim&&t.st==='walk'){t.st='swim';SFX.bloop();drops(t.x,t.y,3,100);logEv('turtleSwim');if(f.d2walk)disc('d2swim',t.x,t.y-30);}
  else if(!swim&&t.st==='swim'){t.st='walk';logEv('turtleWalk');if(eggs.T.hatched)disc('d2walk',t.x,t.y-30);}
  var half=surfW(p2,p2.depth)/2,lim=t.st==='swim'?Math.max(0,half-62):p2.rx*.3;
  var spd=t.st==='swim'?34:10;t.wt-=dt;
  var pushing=false;
  if(t.st==='swim'&&boat.pool===t.pool&&boat.st==='float'&&!boat.loaded&&dino.st==='home'){
    var want=boat.u+HL+28;if(want>lim)want=lim;t.tgt=want;
    if(Math.abs(t.u-want)<14){pushing=true;var canGo=t.pool==='D'?boat.u>-PO.D.rx*.5:true;
      if(canGo){boat.push-=15;t.pushT+=dt;if(t.pushT>2.4){t.pushT=0;SFX.bloop();}}}}
  else if(t.wt<=0){t.wt=2.5+rnd()*3;t.tgt=(rnd()*2-1)*lim;
    if(t.st==='swim'&&ED.DT.open&&rnd()<.35){var other=t.pool==='D'?'T':'D',po=PO[other];var oe=other==='T'?-po.rx*.6:po.rx*.6;
      if(localDepth(po,oe)>=24&&ED.DT.sill-surfY(p2)>6){var sx=p2.cx+t.u,ex2=po.cx+oe;t.st='hop';t.bt=0;t.hop={from:[sx,t.y],to:[ex2,surfY(po)+8],pool:other};t.dir=ex2>sx?1:-1;return;}}}
  t.tgt=clamp(t.tgt,-lim,lim);var dd=t.tgt-t.u;
  if(Math.abs(dd)>2){t.u+=Math.sign(dd)*Math.min(Math.abs(dd),spd*dt);t.dir=pushing?-1:(dd>0?1:-1);}
  if(pushing)t.dir=-1;
  t.u=clamp(t.u,-Math.max(lim,p2.rx*.3),Math.max(lim,p2.rx*.3));
  t.x=p2.cx+t.u;t.y=t.st==='swim'?surfY(p2)+8+waveY(p2,t.x)*.7:floorAt(p2,t.u);
  t.s=1;
}

/* ---------- chick ---------- */
function updateChick(dt){
  var c=chick;c.happy=Math.max(0,c.happy-dt);c.surp=Math.max(0,c.surp-dt);c.wig=Math.max(0,c.wig-dt*3);c.blink-=dt;if(c.blink<-.14)c.blink=3+rnd()*3;c.tilt=0;
  var fs=wind?16:7;c.flap+=dt*fs;c.wingA=-Math.abs(Math.sin(c.flap))*0.9;
  var hv=[eggs.C.ax-58+Math.sin(T*1.3)*12,eggs.C.ay-22+Math.sin(T*2.6)*5];
  switch(c.st){
   case 'egg':c.x=eggs.C.ax;c.y=eggs.C.ay;c.wingA=0;break;
   case 'form':var r=babyRootForming(eggs.C);c.x=r[0];c.y=r[1];c.wingA=0;break;
   case 'rise':c.bt+=dt/1.0;var k=Math.min(1,c.bt);c.x=lerp(c.from[0],hv[0],easeIO(k));c.y=lerp(c.from[1],hv[1],easeIO(k));if(k>=1)c.st='hover';break;
   case 'hover':c.x=hv[0];c.y=hv[1];c.dir=wind>0?1:wind<0?-1:-1;break;
   case 'carry':var bp=boatPose();c.x=bp.x;c.y=bp.y-(boat.loaded?150:95);c.dir=boat.lift&&boat.lift.dir>0?1:-1;c.flap+=dt*10;break;
   case 'goCarry':c.bt+=dt/0.9;var k2=Math.min(1,c.bt),bp2=boatPose();c.x=lerp(c.from[0],bp2.x,easeIO(k2));c.y=lerp(c.from[1],bp2.y-(boat.loaded?150:95),easeIO(k2));if(k2>=1){c.st='carry';beginLiftMove();}break;
   case 'back':c.bt+=dt/1.1;var k3=Math.min(1,c.bt);c.x=lerp(c.from[0],hv[0],easeIO(k3));c.y=lerp(c.from[1],hv[1],easeIO(k3));if(k3>=1)c.st='hover';break;
   case 'bowWalk':case 'bow':endingChar(c,dt,[(PO.D.cx+PO.T.cx)/2+10,L.bowY],1);break;
  }
}
function setWind(dir){
  var prev=wind;wind=dir;windSetT=T;SFX.whistle(dir);logEv('wind:'+dir);
  chick.happy=.6;var cp=[chick.x,chick.y];for(var i=0;i<5;i++)spawn({x:cp[0]+(rnd()-.5)*20,y:cp[1]-20,vx:dir*120+(rnd()-.5)*40,vy:(rnd()-.5)*40,sz:3,c:'ivo',life:.5,g:0});
  if(boat.st==='beach')disc('d4sail0',boatPose().x,boatPose().y-60);
  if(boat.pool==='P'&&boat.st==='float'&&(chick.st==='hover'||chick.st==='back')){chick.st='goCarry';chick.bt=0;chick.from=[chick.x,chick.y];boat.liftDir=dir;}
}

/* ---------- boat ---------- */
function outFlow(pid,e){if(e.a===pid)return e.q>0?e.q:0;if(e.b===pid)return e.q<0?-e.q:0;return 0;}
function edgeU(e,pid){if(e.id==='DT')return pid==='D'?PO.D.rx:-PO.T.rx;if(e.id==='Thi')return PO.T.rx;return 0;}
function updateBoat(dt){
  var b=boat;b.wig=Math.max(0,b.wig-dt*3);b.rockV+=(-b.rock*28-b.rockV*(b.loaded?1.6:2.6))*dt;b.rock+=b.rockV*dt;b.rock=clamp(b.rock,-.6,.6);
  if(b.st==='transit'){b.tr.t+=dt/b.tr.dur;if(b.tr.t>=1)endTransit();return;}
  if(b.st==='lift'){b.lift.t+=dt/b.lift.dur;if(b.lift.t>=1)endLift();return;}
  if(b.st==='waitLift'){return;}
  var p=PO[b.pool],draft=b.loaded?15:7,ld=localDepth(p,b.u),fl=p.active&&ld>draft+1&&p.depth>draft+1;
  if(fl&&b.st!=='float'){b.st='float';logEv('boatFloat:'+b.pool);}else if(!fl&&b.st==='float'){b.st='beach';b.vx=0;logEv('boatBeach:'+b.pool);}
  if(b.st==='float'){
    var tv=wind*(b.loaded?16:40);
    EDGE_ORDER.forEach(function(k){var e=ED[k];if(!e.open)return;var of=outFlow(b.pool,e);if(of>500){var eu=edgeU(e,b.pool);tv+=clamp(of/130,0,60)*Math.sign(eu-b.u||1);}});
    tv+=b.push;b.push=0;
    b.vx+=(tv-b.vx)*Math.min(1,dt*(b.loaded?1.0:1.7));b.u+=b.vx*dt;
    var half=surfW(p,p.depth)/2,lim=Math.max(0,half-HL*.85);
    if(b.u>lim){b.u=lim;if(b.vx>0)b.vx=0;}if(b.u<-lim){b.u=-lim;if(b.vx<0)b.vx=0;}
    if(b.pool==='D'&&b.u>PO.D.rx*.15)b.armed=true;

function computeTarget(){
  if(ending)return null;
  if(!eggs.D.opened)return 'hatchD';
  if(!eggs.T.opened)return 'hatchT';
  if(!eggs.T.hatched)return null;
  var b=boat,E=ED,Tp=PO.T,Dp=PO.D,W=(dino.st==='home'||dino.st==='aboard')?'stomp':null;
  if(b.st==='transit'||b.st==='lift'||b.st==='waitLift'||chick.st==='goCarry'||chick.st==='carry'||dino.st==='board'||dino.st==='off'||dino.st==='walk'||turtle.st==='drop')return W;
  function refill(){if(b.st!=='beach')return null;if(b.pool==='T'){if(E.Tlo.open)return 'Tlo';if(E.Thi.open)return 'Thi';}if(b.pool==='D'&&E.Dlo.open)return 'Dlo';return null;}
  function toDinoShore(){var r=refill();if(r)return r;
    if(b.pool==='T'){if(E.Tlo.open&&Tp.depth<50)return 'Tlo';if(E.Thi.open)return 'Thi';if(!E.DT.open)return 'DT';if(E.Dlo.open)return 'Dlo';if(wind>=0)return 'wind';return W;}
    if(b.pool==='D'){if(E.Dlo.open)return 'Dlo';if(!b.armed)return wind<=0?'wind':W;if(wind>=0)return 'wind';return W;}
    if(b.pool==='P')return 'wind';return W;}
  function toP(){
    if(b.pool==='T'){if(!E.Tlo.open)return 'Tlo';return W;}
    if(b.pool==='D'){var r=refill();if(r)return r;if(E.Dlo.open)return 'Dlo';if(!E.Tlo.open)return 'Tlo';if(!E.DT.open)return 'DT';if(wind<0)return 'wind';return W;}
    return W;}
  /* 2: water height and the turtle */
  if(!f.thiTried&&!f.d2hi)return 'Thi';
  if(!f.d2walk){if(!E.Tlo.open)return 'Tlo';if(!eggs.C.opened)return 'hatchC';return W;}
  if(!eggs.C.opened)return 'hatchC';
  if(!eggs.C.hatched)return null;
  /* 4: wind on a beached boat, then water makes it run */
  if(!f.d4sail0){if(b.st==='float'){if(b.pool==='T')return E.Tlo.open?'wind':'Tlo';if(b.pool==='D')return E.Dlo.open?'wind':'Dlo';}return 'wind';}
  if(!f.d4run){var r1=refill();if(r1)return r1;return 'wind';}
  if(E.Thi.open&&!f.reveal)return 'Thi';
  var rf=refill();
  /* 5: wave reaches the neighbour boat */
  if(!f.d5near&&!b.loaded&&b.pool==='T'){if(!E.DT.open)return 'DT';if(Dp.depth<15&&E.Dlo.open)return 'Dlo';if(rf)return rf;return W;}
  /* 4: reverse wind sends the boat to the other bowl */

    if(Dp.depth<50&&E.Dlo.open)return 'Dlo';if(Tp.depth<50&&E.Tlo.open)return 'Tlo';var want=b.pool==='T'?-1:1;if(wind!==want)return 'wind';return W;}
  /* 6: passenger */
  if(!f.d6board)return toDinoShore();
  if(!f.d6off){if(dino.st==='aboard'&&b.pool==='D'){if(!E.Dlo.open)return 'Dlo';return W;}if(!b.loaded)return toDinoShore();return refill()||W;}
  if(!f.d6compare){if(dino.st==='aboard'){if(!E.Dlo.open&&b.pool==='D')return 'Dlo';return W;}if(rf)return rf;return 'wind';}
  /* 5: closed channel -> only this bowl splashes */
  if(!f.d5solo){if(E.DT.open)return 'DT';if(E.Dlo.open)return 'Dlo';return W;}
  /* 3: high side to low side */
  if(!f.d3cross&&!b.loaded){
    if(b.pool==='D'){if(rf)return rf;if(Tp.depth<50&&E.Tlo.open)return 'Tlo';if(!E.DT.open)return 'DT';if(wind<=0)return 'wind';return W;}
    if(b.pool==='T'){if(E.DT.open&&Dp.depth>12)return 'DT';if(wind>=0)return 'wind';if(Tp.depth<55){if(E.Tlo.open)return 'Tlo';if(E.Thi.open)return 'Thi';}
      if(!E.Dlo.open&&Dp.depth>12)return 'Dlo';if(!E.DT.open)return 'DT';return W;}}
  /* reveal: loaded boat flows from the dino bowl to the emptied neighbour */
  if(!f.reveal){
    if(!b.loaded)return toDinoShore();
    if(b.pool==='D'){if(rf)return rf;if(E.DT.open&&Tp.depth>12&&wind<=0)return 'DT';if(wind<=0)return 'wind';
      if(!E.DT.open&&!E.Tlo.open&&Tp.depth>12)return 'Tlo';if(!E.DT.open)return 'DT';return W;}
    return W;}

  if(!f.visitP)return toP();
  if(b.pool==='P'){
    if(dino.st==='aboard')return 'wind';
    if(!f.d5far&&dino.st==='home'){if(!E.DT.open)return 'DT';if(!E.Tlo.open)return 'Tlo';if(E.Dlo.open)return 'Dlo';return W;}
    if(!f.lift)return 'wind';
    if(drainShown)return 'drain';
    return 'wind';}
  if(b.loaded&&!f.d5far){if(b.pool==='D')return E.Dlo.open?W:'Dlo';if(b.pool==='T')return E.Tlo.open?W:'Tlo';}
  if(drainShown)return 'drain';
  return toP();
}

}
function drawFlying(){
  ['D','T','C'].forEach(function(k){var eg=eggs[k],kind=eg.d.baby,ch=k==='D'?dino:k==='T'?turtle:chick;
    eg.pieces.forEach(function(pc){if(!pc.det||pc.arr)return;var e=easeIO(pc.t),sv=ch.s;ch.s=sv*BABY[kind].s;var dst=partWorld(kind,ch,pc.part);ch.s=sv;
      var src=pc.rs.map(function(q){return [eg.ax+q[0],eg.ay+q[1]];}),cs=centroid(src),cd=centroid(dst),cc=[lerp(cs[0],cd[0],e),lerp(cs[1],cd[1],e)-70*Math.sin(PI*e)];
      var ang=pc.spin*e,c=Math.cos(ang),s=Math.sin(ang),pts=[];
      for(var i=0;i<MRS;i++){var rx=lerp(src[i][0]-cs[0],dst[i][0]-cd[0],e),ry=lerp(src[i][1]-cs[1],dst[i][1]-cd[1],e);pts.push([cc[0]+rx*c-ry*s,cc[1]+rx*s+ry*c]);}
      fillPoly(pts,mixc('ivo',BABY[kind].parts[pc.part].c,e),GW);});});
}
function drawParticles(){for(var i=0;i<parts.length;i++){var p=parts[i],a=clamp(p.life/p.max*1.6,0,1),s=p.sz;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
  ctx.globalAlpha=a;ctx.fillStyle=PAL.grout;ctx.fillRect(-s/2-1,-s/2-1,s+2,s+2);ctx.fillStyle=col(p.c);ctx.fillRect(-s/2,-s/2,s,s);ctx.restore();}}
function drawWind(){
  if(!wind||ending)return;var x0=-OX/S-60,x1=(CW-OX)/S+60,span=x1-x0,yA=L.sky-60,yB=PO.D.rim-10;
  ctx.lineCap='round';
  STREAKS.forEach(function(s){var ph=(s.p+T*.18*s.sp*wind)%1;if(ph<0)ph+=1;var x=x0+ph*span,y=lerp(yA,yB,s.y),l=50*s.l;
    ctx.beginPath();ctx.moveTo(x-l*wind,y);ctx.quadraticCurveTo(x,y-8,x+l*.3*wind,y-2);ctx.lineWidth=5.5;ctx.strokeStyle=col('grout',1,.35);ctx.stroke();ctx.lineWidth=3;ctx.strokeStyle=col('ivo',1,.85);ctx.stroke();});
}
function drawDrain(){
  if(!drainShown||drainA<=0)return;var x=PO.P.cx,y=PO.P.floor+TH+24,s=easeOB(Math.min(1,drainA));
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);var n=5;
  for(var i=0;i<n;i++){var a0=PI+i/n*PI,a1=PI+(i+1)/n*PI;var pts=[[0,16]];for(var k=0;k<=4;k++){var a=lerp(a0,a1,k/4);pts.push([Math.cos(a)*44,16+Math.sin(a)*36]);}
    fillPoly(pts,col(['ivo','ver','ivo','och','ivo'][i]),GW);}
  ctx.restore();
}
function drawHand(){
  if(!demo)return;var c=CR[demo.id];if(!c||!c.pts.length)return;var t=demo.t,a=t<.15?t/.15:t>.85?(1-t)/.15:1,s=clamp((t-.12)/.72,0,1);
  var rev=(demo.id==='wind'&&wind>0);var sp=rev?(1-s):s,p=crackPt(c,sp*c.len);
  var eg=eggOf(c);if(eg){var x=eggXform(eg);p=[p[0],p[1]-x.hop];}
  ctx.save();ctx.setTransform(DPR,0,0,DPR,0,0);var X=OX+p[0]*S,Y=OY+p[1]*S;ctx.globalAlpha=a;ctx.translate(X,Y);var hs=Math.max(1.0,Math.min(1.5,S*1.4));ctx.scale(hs,hs);ctx.rotate(-.35);
  var finger=[[-6,-2],[6,-2],[7,30],[-7,30]],palm=[[-12,24],[18,20],[30,34],[28,58],[6,68],[-14,54]],thumb=[[-11,32],[-25,24],[-28,33],[-13,46]];
  [palm,finger,thumb].forEach(function(pp){ctx.beginPath();ctx.moveTo(pp[0][0],pp[0][1]);for(var i=1;i<pp.length;i++)ctx.lineTo(pp[i][0],pp[i][1]);ctx.closePath();ctx.fillStyle=col('sand',1.12);ctx.fill();ctx.lineWidth=3.5;ctx.strokeStyle=PAL.grout;ctx.stroke();});
  ctx.beginPath();ctx.moveTo(-4,24);ctx.lineTo(16,30);ctx.moveTo(2,46);ctx.lineTo(24,44);ctx.lineWidth=2;ctx.stroke();
  ctx.restore();
}
function frameRect(){var w=Math.min(CW*L.frameW,230),h=w*CH/CW;return [SA.l+12,SA.t+12,w,h];}
function drawFrame(){
  if(!frameThumb)return;var fr=frameRect(),r=fr;
  if(frameAnim){var t=easeIO(clamp(frameAnim.t,0,1));r=[lerp(0,fr[0],t),lerp(0,fr[1],t),lerp(CW,fr[2],t),lerp(CH,fr[3],t)];}
  ctx.save();ctx.setTransform(DPR,0,0,DPR,0,0);var b=Math.max(6,r[2]*.06);
  ctx.fillStyle=PAL.grout;ctx.fillRect(r[0]-b-2,r[1]-b-2,r[2]+b*2+4,r[3]+b*2+4);
  var n=10,i;for(i=0;i<n;i++){var w=(r[2]+b*2)/n;ctx.fillStyle=col(i%2?'och':'sand');ctx.fillRect(r[0]-b+i*w+1,r[1]-b,w-2,b-2);ctx.fillRect(r[0]-b+i*w+1,r[1]+r[3]+2,w-2,b-2);}
  var m=6;for(i=0;i<m;i++){var hh=r[3]/m;ctx.fillStyle=col(i%2?'sand':'och');ctx.fillRect(r[0]-b,r[1]+i*hh+1,b-2,hh-2);ctx.fillRect(r[0]+r[2]+2,r[1]+i*hh+1,b-2,hh-2);}
  ctx.drawImage(frameThumb,r[0],r[1],r[2],r[3]);ctx.restore();
}
function render(){
  if(texDirty){renderAllTex();texDirty=false;}
  SHX=shake>0?Math.sin(T*70)*shake*6*DPR:0;SHY=shake>0?Math.cos(T*55)*shake*4*DPR:0;
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  var tf=(SHX||SHY)?'translate('+(SHX/DPR).toFixed(1)+'px,'+(SHY/DPR).toFixed(1)+'px)':'';if(bgC.style.transform!==tf)bgC.style.transform=tf;
  setW();
  drawAqueduct();drawHoles();
  drawPool(PO.D);drawPool(PO.T);drawPool(PO.P);
  drawEggLower(eggs.D);
  drawStreams();drawFalls();
  drawRing('P');drawRing('D');drawRing('T');drawBridge();
  drawEggLower(eggs.T);drawEggLower(eggs.C);
  drawEggUpper(eggs.D);drawEggUpper(eggs.T);drawEggUpper(eggs.C);
  for(var id in CR)drawCrack(CR[id]);
  drawDrain();
  if(turtle.st==='egg'||turtle.st==='form')drawChar('turtle',turtle,eggs.T);
  if(dino.st!=='aboard'&&dino.st!=='board')drawChar('dino',dino,eggs.D);
  drawBoat();
  if(turtle.st!=='egg'&&turtle.st!=='form')drawChar('turtle',turtle,eggs.T);
  if(dino.st==='aboard'||dino.st==='board')drawChar('dino',dino,eggs.D);
  drawChar('chick',chick,eggs.C);
  drawFlying();drawParticles();drawWind();
  drawHand();
  drawFrame();
}

/* ---------- main loop ---------- */
var running=true,lastTs=0,raf=0;
function frame(ts){
  if(!running)return;var dt=lastTs?Math.min(0.05,Math.max(0,(ts-lastTs)/1000)):0.016;lastTs=ts;
  try{update(dt);render();
    if(snapNow){snapNow=false;try{var th=document.createElement('canvas');th.width=Math.max(1,cv.width/3|0);th.height=Math.max(1,cv.height/3|0);
      var tg=th.getContext('2d');tg.drawImage(bgC,0,0,th.width,th.height);tg.drawImage(cv,0,0,th.width,th.height);frameThumb=th;frameAnim={t:0};}catch(e){}}
    if(frameAnim){frameAnim.t+=dt/1.2;if(frameAnim.t>=1)frameAnim=null;}
  }catch(err){if(!window.__gfErr)window.__gfErr=String(err&&err.stack||err);}
  raf=requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){running=false;cancelAnimationFrame(raf);act=null;pointerW=null;try{if(AU.ctx)AU.ctx.suspend();}catch(e){}}
  else{if(!running){running=true;lastTs=0;try{if(AU.ctx)AU.ctx.resume();}catch(e){}raf=requestAnimationFrame(frame);}}
});

/* ---------- boot ---------- */
bgC.style.pointerEvents='none';document.body.insertBefore(bgC,cv);
initCracks();
applyShape(loadShape());memShape=shapeStr();
resetCycle(true);
doLayout();

/* debug/test hook (no UI) */
window.__GF={
  get T(){return T;},get f(){return f;},get eggs(){return eggs;},get dino(){return dino;},get turtle(){return turtle;},get chick(){return chick;},
  get boat(){return boat;},get wind(){return wind;},get guide(){return guide.id;},get demo(){return demo;},get ending(){return ending;},get cycle(){return cycle;},
  pools:PO,edges:ED,cracks:CR,events:evLog,get saveStatus(){return saveStatus;},get shape(){return shapeStr();},get parts(){return parts.length;},
  get layout(){return {name:L.name,S:S,OX:OX,OY:OY,CW:CW,CH:CH,DPR:DPR,SA:SA};},
  w2s:function(x,y){return [OX+x*S,OY+y*S];},
  crackScreen:function(id){var c=CR[id];return c.pts.map(function(p){return [OX+p[0]*S,OY+p[1]*S];});},
  stepFast:function(sec){var n=Math.round(sec/0.016);for(var i=0;i<n;i++)update(0.016);},
  get err(){return window.__gfErr||null;},
  get frameThumb(){return !!frameThumb;},
  get audio(){return AU.ctx?AU.ctx.state:'none';},
  freezeClock:function(v){FREEZE=!!v;},skip:SKIP,
  bench:function(n){var t0=performance.now();for(var i=0;i<n;i++){update(1/60);render();}return (performance.now()-t0)/n;}
};
raf=requestAnimationFrame(frame);
})();
</script>
